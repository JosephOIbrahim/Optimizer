name: checks

# Every push, on every branch. The suites are fast enough that this is
# cheap, and the figure checks are the point: a document that publishes a
# number no record holds must fail the build, not wait for someone to
# notice it in a review.
on:
  push:
  pull_request:

# The workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  # The fast one, first. These two files are the figure checks: they fail
  # if a card, the README or CLAUDE.md publishes a number that no committed
  # record holds, publishes a superseded number as if it were current, or
  # leaves a figure undeclared. It is the check the repo exists to make
  # automatic, so it gets its own job and fails first.
  figures:
    name: published figures are checkable
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install the test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Every published figure traces to a record
        run: >
          python -m pytest
          tests/test_published_figures.py
          tests/test_source_verdicts.py
          -q

  # The whole thing.
  suites:
    name: suites (python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      # One version failing should not hide the other's result.
      fail-fast: false
      matrix:
        # The repo requires 3.13.7+ and is developed on 3.14; both are
        # verified green.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install the test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      # The V6 orchestrator imports winreg at module level, and a test
      # imports the orchestrator at module level, so the suites cannot be
      # collected on Linux. That is why the runner is Windows.
      #
      # The smoke runs should use the interpreter this job installed, not
      # a machine-local one.
      - name: The repo suite
        env:
          OPTIMIZER_SMOKE_PYTHON: python
        run: python -m pytest tests -q

      - name: The V12 suite
        run: python -m pytest OptimizerV12/tests -q
