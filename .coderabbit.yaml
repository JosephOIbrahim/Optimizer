# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# PROBE: this branch deliberately ENABLES the review bot, so that a silent
# PR proves the APP no longer has access rather than proving the config is
# silencing it. The config on main disables the bot; this one turns it back
# on for the probe only.
reviews:
  auto_review:
    enabled: true
  commit_status: true
  review_progress: true
