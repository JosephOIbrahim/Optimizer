# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# PROBE (after the removal): this branch ENABLES the review bot, so that
# silence proves the APP has lost access to this repo - not that the config
# is silencing it. The config on main disables the bot; this one turns it
# back on for the probe only.
reviews:
  auto_review:
    enabled: true
  commit_status: true
  review_progress: true
