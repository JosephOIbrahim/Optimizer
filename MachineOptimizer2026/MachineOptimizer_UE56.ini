; ============================================================================
; MachineOptimizer 2026 - Unreal Engine 5.6+ rendering profile
; RTX 4090 (24GB) + 6K Apple Pro Display XDR. Verified July 2026.
;
; HOW TO USE: back up your project's  Config\DefaultEngine.ini  first, then append
; the blocks below. Also enable 'Support Hardware Ray Tracing' (SM6) in
; Project Settings > Rendering, and install/enable the NVIDIA DLSS (Streamline)
; plugin for your exact UE minor version.
; REVERT: restore your DefaultEngine.ini backup.
; ============================================================================

[/Script/Engine.RendererSettings]
r.RayTracing=True

[SystemSettings]
; --- Lumen: hardware ray tracing for GI + reflections (reference quality) ---
r.Lumen.HardwareRayTracing=1
r.Lumen.Reflections.HardwareRayTracing=1
r.Lumen.Reflections.Quality=2
r.Lumen.HardwareRayTracing.LightingMode=2

; --- VRAM pools sized for 24GB (LimitPoolSizeToVRAM stops texture spill to sysmem) ---
r.Nanite.Streaming.StreamingPoolSize=2048
r.Streaming.PoolSize=8000
r.Streaming.LimitPoolSizeToVRAM=1
r.Shadow.Virtual.MaxPhysicalPages=6144

; --- DLSS Ray Reconstruction (needs the DLSS plugin + HWRT/Lumen) ---
r.NGX.DLSS.DenoiserMode=1

; --- Path tracer: OptiX denoiser + 4090 sample budget ---
r.PathTracing.Denoiser=1
r.PathTracing.SamplesPerPixel=256
r.PathTracing.MaxBounces=8

; --- Virtual texture throughput for 6K look-dev ---
r.VT.MaxUploadsPerFrame=64
r.VT.MaxContinuousUpdatesPerFrame=8

; --- Offline renders ONLY: uncomment to disable the per-submit GPU timeout.
;     Restore to 1 (default) for interactive work. Pair with TdrDelay=60 (set by
;     the optimizer) and the watchdog as the hang backstop.
; r.D3D12.GPUTimeout=0

[DevOptions.Shaders]
; Use most of the 48 threads for shader compilation on this dedicated box.
NumUnusedShaderCompilingThreads=4
PercentageUnusedShaderCompilingThreads=10
bAllowCompilingThroughWorkers=True
bAllowAsynchronousShaderCompiling=True
